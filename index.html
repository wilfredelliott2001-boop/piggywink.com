<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiggyWink</title>

<style>
  body {
    margin: 0;
    font-family: Consolas, monospace;
    color: #00ffcc;
    background: linear-gradient(-45deg, #0a0a0a, #0f2027, #203a43, #000000);
    background-size: 400% 400%;
    animation: gradient 15s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    border: 1px solid rgba(0,255,200,0.3);
    padding: 30px;
    width: 90%;
    max-width: 700px;
    background: rgba(0,0,0,0.6);
    box-shadow: 0 0 20px rgba(0,255,200,0.2);
    backdrop-filter: blur(10px);
  }

  h1 {
    font-size: 2.5em;
    margin: 0;
    text-shadow: 0 0 10px #00ffcc;
  }

  .status {
    margin-top: 10px;
    color: #00ff88;
  }

  .dot {
    height: 10px;
    width: 10px;
    background-color: #00ff88;
    border-radius: 50%;
    display: inline-block;
    animation: pulse 2s infinite;
    margin-right: 8px;
  }

  @keyframes pulse {
    0% { opacity: 0.3; }
    50% { opacity: 1; }
    100% { opacity: 0.3; }
  }

  .terminal {
    margin-top: 20px;
    color: #00ffaa;
  }

  .terminal span {
    color: #ffffff;
  }

  .footer {
    margin-top: 25px;
    font-size: 0.9em;
    opacity: 0.7;
  }

  a {
    color: #00ffcc;
    text-decoration: none;
  }

  a:hover {
    text-shadow: 0 0 5px #00ffcc;
  }
</style>
</head>

<body>

<div class="container">

  <h1>PiggyWink</h1>

  <div class="status">
    <span class="dot"></span>system status: ONLINE
  </div>

  <div class="terminal">
    <p>> initializing infrastructure node...</p>
    <p>> loading experimental modules...</p>
    <p>> network: <span>active</span></p>
    <p>> domain: <span>piggywink.com</span></p>
    <p>> contact: <span>mail@piggywink.com</span></p>
  </div>

  <div class="footer">
    experimental AI systems · infrastructure · tooling
  </div>

</div>

</body>
</html>
